<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Tasks</title>
    <style>
nav{
    position: sticky;
    top: 0;
    background-color:mediumpurple;
    padding: 15px;
    z-index: 2000;
}
nav a{
    color:black;
    margin: 40px;
    text-decoration:none;
    transition: 0.3s;
}
nav a:hover{
    color: rgb(13, 255, 0);
    font-size: 20px;
}
.section{
    height: 650px;
    padding: 30px;
}
footer{
    position: fixed;
    bottom: 0px;;
    width: 100%;
    background-color:#3f51b5;
    color: rgb(12, 0, 0);
    text-align:center;
    padding: 10px;
}
button{
    padding: 10px 20px;
    background-color: rgb(255, 0, 0);
    color:black;
    border:20px;
    border-radius: 10px;
    transition: 0.2s;
}
button:hover{
    background-color: red;
    transform: scale(1.2);
}
.ball{
    width: 50px;
    height: 50px;
    background: rgb(115, 255, 0);
    border-radius: 50%;
    position: relative;
    animation: bounce 5s infinite alternate;
}
@keyframes bounce{
    from{ top: 0px; }
    to{ top: 300px; }
}
.box1{
    width: 150px;
    height: 150px;
    background:red;
    position: relative;
    z-index: 1;
}

.box2{
    width: 150px;
    height: 150px;
    background: rgb(112, 216, 122);
    position: relative;
    top: -100px;
    left: 50px;
    z-index: 2;
}
.home{
    position: relative;
    width: 300px;
    height: 250px;
    background-color: greenyellow;
    border: 5px solid black;
    top: -29px;
    margin: 50px auto;
}
.topbox{
    position: relative;
    width: 460px;
    height: 30px;
    background-color: orangered;
    border: 5px solid black;
    left: 330px;
    top: 25px;
}
.door{
    position: relative;
    width: 80px;
    height: 140px;
    background-color: #3f51b5;
    border: 5px solid black;
    bottom: -143px;
    left: 104px;
}
.leftbox{
    position: relative;
    width: 50px;
    height: 100px;
    background-color: yellow;
    border: 5px solid black;
    top: -120px;
    left: 30px;
}
.rightbox{
    position: relative;
    width: 45px;
    height: 70px;
    background-color: purple;
    border: 5px solid black;
    top: -200px;
    left: 230px;
}
body{
    background-color:pink;
}
</style>
</head>
<body>
<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>
<div class="section">
    <h2>Button Hover</h2>
    <button>Hover Me</button>
    <h2>Bouncing Ball</h2>
    <div class="ball"></div>
    <h2>Z-Index Example</h2>
    <div class="box1"></div>
    <div class="box2"></div>
    <h2>House Design</h2>
    <div class="topbox"></div>
    <div class="home">
        <div class="door"></div>
        <div class="leftbox"></div>
        <div class="rightbox"></div>
    </div>
</div>
<footer>
    Fixed Footer
</footer>
</body>
</html>

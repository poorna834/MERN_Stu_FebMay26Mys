<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center mt-30">

    <div class="bg-white p-6 rounded-lg shadow w-90">

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold tracking-wide">
        Notification Center
      </h2>

       <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-sm font-semibold">
        3 New
      </span>
    </div>

     <div class="bg-red-100 border-l-4 border-red-500 p-4 rounded mb-4">
      <h3 class="font-bold text-red-700 mb-1">
        Action Required
      </h3>
      <p class="text-red-600 leading-relaxed">
        Your last payment attempt failed. Please update your payment
        method to avoid service interruption.
      </p>
    </div>
    
    <div class="bg-yellow-100 border-l-4 border-yellow-500 p-4 rounded mb-6">
      <h3 class="font-bold text-yellow-800 mb-1">
        Maintenance Notice
      </h3>
      <p class="text-yellow-700 leading-relaxed">
        The system will undergo maintenance tonight.
        Some features may be temporarily unavailable.
      </p>
    </div>
   

    <button class="bg-blue-500 hover:bg-red-400 text-white px-4 py-2 rounded-lg shadow">
        View All
      </button>

      
      <button class="border border-gray-400 text-gray-700 px-4 py-2 rounded-lg hover:bg-green-100">
        Dismiss
      </button>

    </div>

  </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <!-- Learning about forms -->
     <form action="" method="post">
     <label for="name">Enter Full Name:</label>
     <input type="text" id="name" placeholder="Enter Full Name" required>
     <input type="email" name="email" id="email" required>
     <input type="password" name="password" id="password" required>
     <input type="number" name="age" id="age" min="10" max="100">
     <input type="file" name="resume" id="resume" id="resume">
     <input type="date" name="date" id="date">
     <input type="button" value="button">
     <input type="button" value="button">
     <input type="checkbox" name="checkbox" id="checkbox">
     <input type="color" name="yellow" id="yellow">
     <input type="time" name="time" id="time">
     <input type="hidden" name="File">
     <input type="image" src="beach.jpeg" alt="Beach">
     <input type="url" name="https://www.google.com" id="Google">
     <input type="submit" value="Register">
     </form>
</body>
</html>
